spring:
  application:
    name: apigateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: employee-service
              uri: lb://employee
              predicates:
                - Path=/api/employees/**

            - id: leave-service
              uri: lb://leaveservice
              predicates:
                - Path=/api/leaves/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true